<!DOCTYPE html>
<html>
<body>
  <h3>Inversează literele alfabetului</h3>

  <input type="text" id="textInput" placeholder="Scrie un text aici">
  <button onclick="inverseazaTextul()">Inversează</button>

  <p>Rezultat: <span id="rezultat"></span></p>

  <script>
    function inverseazaTextul() {
      var text = document.getElementById("textInput").value;
      var rezultat = "";

      for (var i = 0; i < text.length; i++) {
        var litera = text[i];

        if (litera >= 'a' && litera <= 'z') {
          var cod = litera.charCodeAt(0);
          var codNou = 122 - (cod - 97); // 'z' = 122, 'a' = 97
          rezultat += String.fromCharCode(codNou);
        } else if (litera >= 'A' && litera <= 'Z') {
          // Transformă literele mari
          var cod = litera.charCodeAt(0);
          var codNou = 90 - (cod - 65); // 'Z' = 90, 'A' = 65
          rezultat += String.fromCharCode(codNou);
        } else {
          rezultat += litera;
        }
      }

      document.getElementById("rezultat").innerText = rezultat;
    }
  </script>
</body>
</html>
