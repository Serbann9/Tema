<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numere Armstrong</title>
</head>
<body>

    <h1>Numere Armstrong într-un interval dat</h1>
    <label for="min">Limita inferioară: </label>
    <input type="number" id="min" value="1">
    <br><br>
    <label for="max">Limita superioară: </label>
    <input type="number" id="max" value="1000">
    <br><br>
    <button onclick="afiseazaArmstrong()">Afisează numere Armstrong</button>

    <h3>Rezultate:</h3>
    <ul id="rezultate"></ul>

    <script>
        function afiseazaArmstrong() {
            const min = document.getElementById('min').value;
            const max = document.getElementById('max').value;
            const rezultate = document.getElementById('rezultate');
            rezultate.innerHTML = '';

            for (let i = min; i <= max; i++) {
                const suma = i.toString().split('').reduce((acc, cifra) => acc + Math.pow(cifra, 3), 0);
                if (suma == i) {
                    const li = document.createElement('li');
                    li.textContent = i;
                    rezultate.appendChild(li);
                }
            }
        }
    </script>

</body>
</html>
